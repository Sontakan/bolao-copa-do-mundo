name: Update Match Results

on:
  schedule:
    # Horários pós-jogo (UTC) = ~2h após início de cada partida
    - cron: '10 18 * * *'   # 15:10 BRT
    - cron: '10 19 * * *'   # 16:10 BRT
    - cron: '10 21 * * *'   # 18:10 BRT
    - cron: '10 22 * * *'   # 19:10 BRT
    - cron: '10 23 * * *'   # 20:10 BRT
    - cron: '10 0 * * *'    # 21:10 BRT
    - cron: '10 1 * * *'    # 22:10 BRT
    - cron: '10 2 * * *'    # 23:10 BRT
    - cron: '10 3 * * *'    # 00:10 BRT
    - cron: '10 4 * * *'    # 01:10 BRT
    - cron: '10 5 * * *'    # 02:10 BRT
    - cron: '10 6 * * *'    # 03:10 BRT
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and update results from ESPN
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          from datetime import datetime, timedelta

          # Carrega results.json existente
          try:
              with open('results.json') as f:
                  existing = json.load(f)
          except:
              existing = []

          # Cria mapa dos jogos existentes por homeTeam-awayTeam
          match_map = {}
          for m in existing:
              if m.get('homeTeam') and m.get('awayTeam'):
                  key = f"{m['homeTeam']}-{m['awayTeam']}"
                  match_map[key] = m

          # Busca resultados da ESPN para os últimos 3 dias e hoje
          today = datetime.utcnow()
          updates = 0

          for days_back in range(3):
              date = today - timedelta(days=days_back)
              date_str = date.strftime('%Y%m%d')
              url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates={date_str}"
              
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read())
                  
                  for event in data.get('events', []):
                      comp = event.get('competitions', [{}])[0]
                      competitors = comp.get('competitors', [])
                      if len(competitors) != 2:
                          continue
                      
                      status_type = event.get('status', {}).get('type', {}).get('name', '')
                      home = competitors[0].get('team', {}).get('displayName', '')
                      away = competitors[1].get('team', {}).get('displayName', '')
                      
                      if not home or not away:
                          continue
                      
                      key = f"{home}-{away}"
                      
                      if status_type == 'STATUS_FULL_TIME':
                          hs = competitors[0].get('score')
                          aws = competitors[1].get('score')
                          try:
                              hs = int(hs)
                              aws = int(aws)
                          except (ValueError, TypeError):
                              continue
                          
                          if key in match_map:
                              old = match_map[key]
                              if old.get('status') != 'FINISHED' or old.get('homeScore') != hs:
                                  match_map[key]['homeScore'] = hs
                                  match_map[key]['awayScore'] = aws
                                  match_map[key]['status'] = 'FINISHED'
                                  updates += 1
                                  print(f"Updated: {home} {hs} x {aws} {away}")
                          else:
                              match_map[key] = {
                                  "id": event.get('id', ''),
                                  "homeTeam": home,
                                  "awayTeam": away,
                                  "homeScore": hs,
                                  "awayScore": aws,
                                  "status": "FINISHED",
                                  "utcDate": event.get('date', ''),
                                  "matchday": 0
                              }
                              updates += 1
                              print(f"Added: {home} {hs} x {aws} {away}")
                      
                      elif 'PROGRESS' in status_type or 'HALFTIME' in status_type:
                          if key in match_map:
                              match_map[key]['status'] = 'IN_PLAY'
              
              except Exception as e:
                  print(f"Error fetching {date_str}: {e}")

          # Salva resultado atualizado
          result = list(match_map.values())
          with open('results.json', 'w') as f:
              json.dump(result, f, indent=2, ensure_ascii=False)

          finished = [m for m in result if m['status'] == 'FINISHED' and m.get('homeScore') is not None]
          print(f"\nTotal matches: {len(result)}")
          print(f"Finished: {len(finished)}")
          print(f"Updates this run: {updates}")
          EOF

      - name: Commit results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update match results from ESPN"
            git push
          fi

      - name: Inject secrets into config.js
        run: |
          sed -i "s|__SHEETS_API_KEY__|${{ secrets.SHEETS_API_KEY }}|g" config.js
          sed -i "s|__SPREADSHEET_ID__|${{ secrets.SPREADSHEET_ID }}|g" config.js
          sed -i "s|__FOOTBALL_API_TOKEN__|${{ secrets.FOOTBALL_API_TOKEN }}|g" config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
