name: Update Match Results

on:
  schedule:
    # Pós-jogo: início + 2h (horário dos jogos fase de grupos)
    # Jogos às 13h BRT → termina ~15h BRT = 18:10 UTC
    - cron: '10 18 * * *'
    # Jogos às 16h BRT → termina ~18h BRT = 21:10 UTC
    - cron: '10 21 * * *'
    # Jogos às 19h BRT → termina ~21h BRT = 00:10 UTC
    - cron: '10 0 * * *'
    # Jogos às 22h BRT → termina ~00h BRT = 03:10 UTC
    - cron: '10 3 * * *'
    # Extra: checagem final do dia 
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and update results from ESPN
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta

          FOOTBALL_API_TOKEN = os.environ.get('FOOTBALL_API_TOKEN', '')

          # Carrega results.json existente
          try:
              with open('results.json') as f:
                  existing = json.load(f)
          except:
              existing = []

          # Cria mapa dos jogos existentes por homeTeam-awayTeam
          match_map = {}
          for m in existing:
              if m.get('homeTeam') and m.get('awayTeam'):
                  key = f"{m['homeTeam']}-{m['awayTeam']}"
                  match_map[key] = m

          # Busca dados da football-data.org para obter regularTime de jogos com prorrogação
          fdata_regular_time = {}  # key: "homeTeam-awayTeam" -> (homeScore90, awayScore90)
          if FOOTBALL_API_TOKEN:
              try:
                  url = "https://api.football-data.org/v4/competitions/WC/matches?status=FINISHED"
                  req = urllib.request.Request(url, headers={
                      'X-Auth-Token': FOOTBALL_API_TOKEN
                  })
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      fdata = json.loads(resp.read())
                  
                  for match in fdata.get('matches', []):
                      regular = match.get('score', {}).get('regularTime')
                      if regular and regular.get('home') is not None:
                          home_name = match.get('homeTeam', {}).get('name', '')
                          away_name = match.get('awayTeam', {}).get('name', '')
                          key = f"{home_name}-{away_name}"
                          fdata_regular_time[key] = (regular['home'], regular['away'])
                  
                  print(f"football-data.org: {len(fdata_regular_time)} jogos com regularTime carregados")
              except Exception as e:
                  print(f"football-data.org fallback error (non-fatal): {e}")

          # Busca resultados da ESPN para os últimos 3 dias e hoje
          today = datetime.utcnow()
          updates = 0
          aet_games_needing_correction = []  # jogos AET sem linescores para corrigir via fdata

          for days_back in range(3):
              date = today - timedelta(days=days_back)
              date_str = date.strftime('%Y%m%d')
              url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates={date_str}"
              
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read())
                  
                  for event in data.get('events', []):
                      comp = event.get('competitions', [{}])[0]
                      competitors = comp.get('competitors', [])
                      if len(competitors) != 2:
                          continue
                      
                      status_type = event.get('status', {}).get('type', {}).get('name', '')
                      home = competitors[0].get('team', {}).get('displayName', '')
                      away = competitors[1].get('team', {}).get('displayName', '')
                      
                      if not home or not away:
                          continue
                      
                      key = f"{home}-{away}"
                      
                      # Aceita jogos finalizados: tempo normal, prorrogação ou pênaltis
                      if status_type in ('STATUS_FULL_TIME', 'STATUS_FINAL_AET', 'STATUS_FINAL_PEN'):
                          detail = event.get('status', {}).get('type', {}).get('detail', '')
                          home_linescores = competitors[0].get('linescores', [])
                          away_linescores = competitors[1].get('linescores', [])
                          
                          is_extra_time = status_type in ('STATUS_FINAL_AET', 'STATUS_FINAL_PEN') or detail in ('AET', 'FT-Pens')
                          
                          if is_extra_time and len(home_linescores) >= 2:
                              # Jogo teve prorrogação/pênaltis E temos linescores — soma só 1º e 2º tempo
                              try:
                                  hs = sum(int(ls.get('displayValue', 0)) for ls in home_linescores[:2])
                                  aws = sum(int(ls.get('displayValue', 0)) for ls in away_linescores[:2])
                              except (ValueError, TypeError):
                                  continue
                              print(f"  (prorrogação com linescores: {home} {hs}x{aws} {away})")
                          elif is_extra_time:
                              # Jogo com tempo extra (AET ou PEN) sem linescores
                              # NÃO podemos confiar no score da ESPN pois pode ser placar dos 120min
                              # Tenta usar football-data.org regularTime
                              found_regular = False
                              for fkey, (fh, fa) in fdata_regular_time.items():
                                  # Match por nome parcial (ESPN e fdata podem usar nomes diferentes)
                                  if (home.lower() in fkey.lower() or fkey.lower().split('-')[0].strip() in home.lower()) and \
                                     (away.lower() in fkey.lower() or fkey.lower().split('-')[1].strip() in away.lower()):
                                      hs = fh
                                      aws = fa
                                      found_regular = True
                                      print(f"  (tempo extra corrigido via football-data.org regularTime: {home} {hs}x{aws} {away})")
                                      break
                              
                              if not found_regular:
                                  # Sem regularTime — pula este jogo (não registra placar errado)
                                  print(f"  WARNING: {home} vs {away} tempo extra sem regularTime disponível, pulando")
                                  aet_games_needing_correction.append(key)
                                  continue
                          else:
                              # Tempo normal — usa score direto
                              hs = competitors[0].get('score')
                              aws = competitors[1].get('score')
                              try:
                                  hs = int(hs)
                                  aws = int(aws)
                              except (ValueError, TypeError):
                                  continue
                          
                          if key in match_map:
                              old = match_map[key]
                              if old.get('status') != 'FINISHED' or old.get('homeScore') != hs or old.get('awayScore') != aws:
                                  match_map[key]['homeScore'] = hs
                                  match_map[key]['awayScore'] = aws
                                  match_map[key]['status'] = 'FINISHED'
                                  updates += 1
                                  print(f"Updated: {home} {hs} x {aws} {away}")
                          else:
                              match_map[key] = {
                                  "id": event.get('id', ''),
                                  "homeTeam": home,
                                  "awayTeam": away,
                                  "homeScore": hs,
                                  "awayScore": aws,
                                  "status": "FINISHED",
                                  "utcDate": event.get('date', ''),
                                  "matchday": 0
                              }
                              updates += 1
                              print(f"Added: {home} {hs} x {aws} {away}")
                      
                      elif 'PROGRESS' in status_type or 'HALFTIME' in status_type:
                          if key in match_map:
                              match_map[key]['status'] = 'IN_PLAY'
              
              except Exception as e:
                  print(f"Error fetching {date_str}: {e}")

          if aet_games_needing_correction:
              print(f"\nWARNING: {len(aet_games_needing_correction)} jogos AET sem placar 90min disponível")

          # Salva resultado atualizado
          result = list(match_map.values())
          with open('results.json', 'w') as f:
              json.dump(result, f, indent=2, ensure_ascii=False)

          finished = [m for m in result if m['status'] == 'FINISHED' and m.get('homeScore') is not None]
          print(f"\nTotal matches: {len(result)}")
          print(f"Finished: {len(finished)}")
          print(f"Updates this run: {updates}")
          EOF

      - name: Commit results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update match results from ESPN"
            git push
          fi

      - name: Inject secrets into config.js
        run: |
          sed -i "s|__SHEETS_API_KEY__|${{ secrets.SHEETS_API_KEY }}|g" config.js
          sed -i "s|__SPREADSHEET_ID__|${{ secrets.SPREADSHEET_ID }}|g" config.js
          sed -i "s|__FOOTBALL_API_TOKEN__|${{ secrets.FOOTBALL_API_TOKEN }}|g" config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          overwrite: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
